<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>준비중</title>
    <link rel= "stylesheet" href="css/reset.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images_10000_recipes/favicon.png">
    <style>
         *, *::before, *::after { box-sizing: border-box;}

        :root {
            --orange: #ff6200;
            --orange-light: #fff3ec;
            --orange-mid: #ffdcc7;
            --text-dark: #222;
            --text-mid: #555;
            --text-light: #999;
            --border: #e8e8e8;
            --bg: #fff;
            --header-h: 130px;
        }

        body {
            background: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .coming-soon-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 100px;
            text-align: center;
        }

        /* 일러스트 냄비 */
        .cs-illustration {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 40px;
        }

        .cs-illustration svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* 증기 애니메이션 */
        @keyframes steam {
            0%   { opacity: 0; transform: translateY(0) scaleX(1); }
            30%  { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-28px) scaleX(1.3); }
        }

        .steam-path {
            animation: steam 2s ease-in-out infinite;
        }
        .steam-path:nth-child(2) { animation-delay: 0.4s; }
        .steam-path:nth-child(3) { animation-delay: 0.8s; }

        /* 냄비 살짝 흔들기 */
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            20%       { transform: rotate(-2deg); }
            40%       { transform: rotate(2deg); }
            60%       { transform: rotate(-1.5deg); }
            80%       { transform: rotate(1.5deg); }
        }

        .pot-body { animation: wobble 3s ease-in-out infinite; transform-origin: center bottom; }

        /* 점 로딩 */
        @keyframes dot-bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40%            { transform: translateY(-8px); opacity: 1; }
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 28px auto 0;
        }

        .loading-dots span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--orange);
            display: inline-block;
            animation: dot-bounce 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* 텍스트 */

        .cs-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .cs-title em {
            color: var(--orange);
            font-style: normal;
        }

        .cs-desc {
            font-size: 25px;
            color: var(--text-mid);
            line-height: 1.8;
            max-width: 400px;
            margin: 0 auto;
        }

        /* 구분선 */
        .cs-divider {
            width: 40px;
            height: 3px;
            background: var(--orange-mid);
            border-radius: 2px;
            margin: 28px auto;
        }

        /* 홈 버튼 */
        .cs-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 36px;
            padding: 13px 28px;
            background: var(--orange);
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.18s, transform 0.15s;
        }

        .cs-btn:hover {
            background: #e05600;
            transform: translateY(-1px);
            color: #fff;
        }

        .cs-btn svg { flex-shrink: 0; }

        /* 배경 도트 패턴 */
        .coming-soon-wrap::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle, #ffd4b8 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.35;
            pointer-events: none;
            z-index: -1;
        }

        /* ── Responsive ─────────────────────────────── */
        @media (max-width: 768px) {
            .bottom_top_menu { display: none; }
            .search-box input { width: 160px; }
            .footer_inner { flex-direction: column; gap: 20px; }
            .footer_divider { display: none; }
            .cs-title { font-size: 22px; }
            .cs-illustration { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <main class="coming-soon-wrap">
        <div class="cs-illustration" aria-hidden="true">
            <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g>
                    <path class="steam-path" d="M62 52 Q58 44 62 36 Q66 28 62 20"
                          stroke="#ffb07a" stroke-width="3" stroke-linecap="round" fill="none"/>
                    <path class="steam-path" d="M80 48 Q76 40 80 32 Q84 24 80 16"
                          stroke="#ffb07a" stroke-width="3" stroke-linecap="round" fill="none"/>
                    <path class="steam-path" d="M98 52 Q94 44 98 36 Q102 28 98 20"
                          stroke="#ffb07a" stroke-width="3" stroke-linecap="round" fill="none"/>
                </g>
                <!-- 냄비 몸체 -->
                <g class="pot-body">
                    <!-- 뚜껑 -->
                    <rect x="36" y="66" width="88" height="10" rx="5" fill="#ff6200"/>
                    <rect x="68" y="58" width="24" height="12" rx="6" fill="#e05600"/>

                    <!-- 몸통 -->
                    <rect x="32" y="76" width="96" height="56" rx="12" fill="#ff6200"/>

                    <!-- 하이라이트 -->
                    <rect x="42" y="84" width="30" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>

                    <!-- 내용물 (국물) -->
                    <rect x="32" y="76" width="96" height="18" rx="12" fill="#ff8533" opacity="0.5"/>

                    <!-- 손잡이 왼쪽 -->
                    <rect x="16" y="88" width="20" height="10" rx="5" fill="#cc4e00"/>
                    <!-- 손잡이 오른쪽 -->
                    <rect x="124" y="88" width="20" height="10" rx="5" fill="#cc4e00"/>

                    <!-- 밑판 -->
                    <rect x="44" y="132" width="72" height="8" rx="4" fill="#cc4e00"/>
                </g>
            </svg>
        </div>

        <h1 class="cs-title">
            맛있는 페이지를<br>
            <em>열심히 준비하고 있어요!</em>
        </h1>

        <div class="cs-divider"></div>
        <p class="cs-desc">
            해당 페이지는 현재 제작 중입니다.
        </p>

        <div class="loading-dots" role="status" aria-label="준비중">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <a href="index.html" class="cs-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M2 8L8 2L14 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="4" y="8" width="8" height="6" rx="1" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            홈으로 돌아가기
        </a>
    </main>

</body>
</html>
