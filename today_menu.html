    };

    // ── PHYSICS STATE ──
    const HEADER_H = 72;
    const bubbles = [];
    let W = window.innerWidth;
    let H = window.innerHeight;

    function randBetween(a, b) { return a + Math.random() * (b - a); }

    function createBubble(cat, index) {
      const size = randBetween(110, 155);
      const el = document.createElement('div');
      el.className = `bubble bubble-${cat.id}`;
      el.style.width = size + 'px';
      el.style.height = size + 'px';

      el.innerHTML = `
        <div class="bubble-inner">
          <div class="bubble-icon" style="width:46%;height:46%;display:flex;align-items:center;justify-content:center;">
            ${svgData[cat.icon]}
          </div>
          <span class="bubble-label">${cat.label}</span>
        </div>`;

      document.getElementById('stage').appendChild(el);

      const state = {
        el,
        cat,
        size,
        x: randBetween(size, W - size),
        y: randBetween(HEADER_H + size, H - size),
        vx: randBetween(-1.2, 1.2),
        vy: randBetween(-1.2, 1.2),
        wobble: randBetween(0, Math.PI * 2),
        wobbleSpeed: randBetween(0.008, 0.018),
        wobbleAmp: randBetween(2, 6),
        isDragging: false,
        dragOffX: 0,
        dragOffY: 0,
      };

      // Make sure no zero velocity
      if (Math.abs(state.vx) < 0.3) state.vx = 0.4 * (Math.random() > 0.5 ? 1 : -1);
      if (Math.abs(state.vy) < 0.3) state.vy = 0.4 * (Math.random() > 0.5 ? 1 : -1);

      // ── CLICK / DRAG ──
      let pointerMoved = false;
      let downX = 0, downY = 0;

      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        pointerMoved = false;
        downX = e.clientX;
        downY = e.clientY;
        state.isDragging = true;
        state.dragOffX = e.clientX - state.x;  // offset from center
        state.dragOffY = e.clientY - state.y;
        state.vx = 0;
        state.vy = 0;
        el.style.zIndex = 50;
        el.style.cursor = 'grabbing';
        el.style.transition = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!state.isDragging) return;
        const dx = e.clientX - downX;
        const dy = e.clientY - downY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) pointerMoved = true;
        state.x = e.clientX - state.dragOffX;  // center follows cursor
        state.y = e.clientY - state.dragOffY;
        state.vx = 0;
        state.vy = 0;
        el.style.transform = `translate(${state.x - state.size/2}px, ${state.y - state.size/2}px)`;
      });

      document.addEventListener('mouseup', (e) => {
        if (!state.isDragging) return;
        state.isDragging = false;
        el.style.cursor = 'grab';
        el.style.zIndex = 10;

        if (!pointerMoved) {
          catchBubble(state);
        } else {
          // 놓을 때 약한 fling — 마우스 이동 거리 기반
          const dx = e.clientX - downX;
          const dy = e.clientY - downY;
          state.vx = Math.max(-3, Math.min(3, dx * 0.04));
          state.vy = Math.max(-3, Math.min(3, dy * 0.04));
          if (Math.abs(state.vx) < 0.2 && Math.abs(state.vy) < 0.2) {
            state.vx = randBetween(-0.8, 0.8) || 0.5;
            state.vy = randBetween(-0.8, 0.8) || 0.5;
          }
        }
      });

      // Touch support
      let touchMoved = false;
      let touchDownX = 0, touchDownY = 0;

      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        touchMoved = false;
        touchDownX = t.clientX;
        touchDownY = t.clientY;
        state.isDragging = true;
        state.dragOffX = t.clientX - state.x;  // offset from center
        state.dragOffY = t.clientY - state.y;
        state.vx = 0;
        state.vy = 0;
      }, { passive: false });

      el.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!state.isDragging) return;
        const t = e.touches[0];
        const dx = t.clientX - touchDownX;
        const dy = t.clientY - touchDownY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) touchMoved = true;
        state.x = t.clientX - state.dragOffX;  // center follows finger
        state.y = t.clientY - state.dragOffY;
        state.vx = 0;
        state.vy = 0;
        el.style.transform = `translate(${state.x - state.size/2}px, ${state.y - state.size/2}px)`;
      }, { passive: false });

      el.addEventListener('touchend', (e) => {
        if (!state.isDragging) return;
        state.isDragging = false;
        if (!touchMoved) {
          catchBubble(state);
        } else {
          state.vx = randBetween(-0.8, 0.8) || 0.5;
          state.vy = randBetween(-0.8, 0.8) || 0.5;
        }
      });

      return state;
    }

    function catchBubble(state) {
      const el = state.el;
      // Ripple
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.width = state.size + 'px';
      ripple.style.height = state.size + 'px';
      ripple.style.left = '0';
      ripple.style.top = '0';
      el.querySelector('.bubble-inner').appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      // Caught bounce
      el.classList.remove('caught');
      void el.offsetWidth;
      el.classList.add('caught');
      setTimeout(() => el.classList.remove('caught'), 500);

      // Toast
      const toast = document.getElementById('toast');
      toast.innerHTML = `<em>${state.cat.label}</em> 레시피로 이동합니다 🍽️`;
      toast.classList.add('show');

      // Navigate after short delay
      const urls = state.cat.urls;
      const target = urls[Math.floor(Math.random() * urls.length)];
      setTimeout(() => {
        toast.classList.remove('show');
        window.open(target, '_blank');
      }, 800);
    }

    // ── INIT ──
    categories.forEach((cat, i) => {
      bubbles.push(createBubble(cat, i));
    });

    // ── ANIMATION LOOP ──
    const FRICTION = 0.995;
    const MIN_SPEED = 0.3;
    const MAX_SPEED = 2.5;

    function tick() {
      W = window.innerWidth;
      H = window.innerHeight;

      bubbles.forEach(b => {
        if (b.isDragging) return;

        b.wobble += b.wobbleSpeed;
        const wobbleX = Math.sin(b.wobble) * b.wobbleAmp;
        const wobbleY = Math.cos(b.wobble * 0.7) * b.wobbleAmp * 0.6;

        b.x += b.vx;
        b.y += b.vy;

        // Boundary bounce
        const r = b.size / 2;
        if (b.x - r < 0) { b.x = r; b.vx = Math.abs(b.vx) * 0.9; }
        if (b.x + r > W) { b.x = W - r; b.vx = -Math.abs(b.vx) * 0.9; }
        if (b.y - r < HEADER_H) { b.y = HEADER_H + r; b.vy = Math.abs(b.vy) * 0.9; }
        if (b.y + r > H) { b.y = H - r; b.vy = -Math.abs(b.vy) * 0.9; }

        // Friction
        b.vx *= FRICTION;
        b.vy *= FRICTION;

        // Maintain minimum speed
        const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (speed < MIN_SPEED) {
          const angle = Math.random() * Math.PI * 2;
          b.vx += Math.cos(angle) * 0.15;
          b.vy += Math.sin(angle) * 0.15;
        }
        if (speed > MAX_SPEED) {
          b.vx = (b.vx / speed) * MAX_SPEED;
          b.vy = (b.vy / speed) * MAX_SPEED;
        }

        // Avoid center zone
        const cx = W / 2, cy = H / 2;
        const dx = b.x - cx, dy = b.y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const centerZone = Math.min(W, H) * 0.18;
        if (dist < centerZone) {
          const push = (centerZone - dist) / centerZone * 0.25;
          b.vx += (dx / dist) * push;
          b.vy += (dy / dist) * push;
        }

        b.el.style.transform = `translate(${b.x - b.size/2 + wobbleX}px, ${b.y - b.size/2 + wobbleY}px)`;
      });

      // Bubble–bubble collision
      for (let i = 0; i < bubbles.length; i++) {
        for (let j = i + 1; j < bubbles.length; j++) {
          const a = bubbles[i], b2 = bubbles[j];
          const dx = b2.x - a.x, dy = b2.y - a.y;
          const minDist = (a.size + b2.size) / 2 * 0.85;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < minDist && dist > 0) {
            const nx = dx / dist, ny = dy / dist;
            const overlap = minDist - dist;
            a.x -= nx * overlap * 0.5;
            a.y -= ny * overlap * 0.5;
            b2.x += nx * overlap * 0.5;
            b2.y += ny * overlap * 0.5;
            const relVx = a.vx - b2.vx, relVy = a.vy - b2.vy;
            const dot = relVx * nx + relVy * ny;
            if (dot > 0) {
              a.vx -= dot * nx * 0.6;
              a.vy -= dot * ny * 0.6;
              b2.vx += dot * nx * 0.6;
              b2.vy += dot * ny * 0.6;
            }
          }
        }
      }

      requestAnimationFrame(tick);
    }

    tick();

    window.addEventListener('resize', () => {
      W = window.innerWidth;
      H = window.innerHeight;
    });
  </script>
